stages:
  - test
  - deploy

default:
  image: python:3.12-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  GIT_DEPTH: "0"

cache:
  paths:
    - .uv-cache/

test_application:
  stage: test
  before_script:
    - pip install uv
    - uv sync --frozen
  script:
    - uv run python -m compileall -q src

deploy_to_github:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - git push "https://x-access-token:${GITHUB_TOKEN}@github.com/215018/restaurant-rag_main.git" HEAD:main
  environment:
    name: production
    url: https://restaurant-ragmain-lmule9hdhgfqdvgcrv2rzh.streamlit.app/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'